<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bestari Food Berhad | Mudah dan Sedap!</title>
<meta name="description" content="Design preview of the whole Bestari Food Berhad site, laid out after farmfresh.com.my in Bestari's own colours.">
<link rel="icon" href="../assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Noto+Sans+SC:wght@400;600&display=swap" rel="stylesheet">
<!-- Archivo's own ampersand is a stylised "Ɛ" shape that reads oddly, so the & alone (text=%26, unicode-range U+26)
     comes from Roboto Flex, which has a classic & and the same width and weight axes. Nothing else changes. -->
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&text=%26&display=swap" rel="stylesheet">
<style>
/* ============================================================================================
   Bestari Food Berhad: whole-site design preview.
   Layout follows farmfresh.com.my (white header with one bright button, full-width photo hero,
   full-colour bands with centred titles, product pills, IR icon menu + ticker strip + grey cards).
   Colours stay Bestari's: Pantone 342 C green, its deep shade, the soft tint and the mint accent.
   Type stays Archivo (the site's one family); Noto Sans SC draws Chinese names only, Roboto Flex the & only.
   ============================================================================================ */
:root {
  --brand: #006747;
  --brand-deep: #004a33;
  --tint: #dcebe1;
  --mint: #a8e0c6;
  --grey: #efefea;
  --grey-2: #e2e3dc;
  --sand: #e8e3d2;
  --ink: #12352a;
  --ink-2: #4a5852;
  --line: rgba(0, 103, 71, 0.18);
  --err: #b3261e;
  --font: 'Roboto Flex', 'Archivo', 'Noto Sans SC', system-ui, sans-serif;
  --hdr: 104px;
  --wrap: 1200px;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --shadow: 0 12px 32px rgba(18, 53, 42, 0.14);
  --bar: var(--mint);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--hdr) + 12px); }
body {
  font-family: var(--font); color: var(--ink); background: #fff; font-size: 16px; line-height: 1.65;
  font-synthesis: none; -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
.on-dark :focus-visible { outline-color: var(--mint); }
svg.i { width: 1em; height: 1em; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 24px; }
.narrow { max-width: 860px; }
.center { text-align: center; }
.mt { margin-top: 40px; }
.zh { font-family: 'Noto Sans SC', var(--font); }

/* ---------- Type ---------- */
h1, h2, .display { font-weight: 800; font-stretch: 75%; text-transform: uppercase; line-height: 1.02; letter-spacing: 0.01em; text-wrap: balance; }
h3, h4 { font-weight: 700; line-height: 1.25; text-wrap: balance; }
.title { font-size: clamp(34px, 4.4vw, 56px); color: var(--brand); text-align: center; }
.title::after { content: ""; display: block; width: 56px; height: 4px; border-radius: 2px; background: var(--bar); margin: 18px auto 0; }
.title.left { text-align: left; }
.title.left::after { margin-left: 0; }
.on-dark .title, .on-dark h1, .on-dark h2 { color: #fff; }
.band--tint { --bar: var(--brand); }
.lead { font-size: 18px; color: var(--ink-2); max-width: 720px; margin: 22px auto 0; text-align: center; }
.lead.left { margin-left: 0; text-align: left; }
.on-dark .lead, .on-dark p { color: #e3f1e9; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--brand); margin-bottom: 12px; }
.on-dark .eyebrow { color: var(--mint); }
.muted { color: var(--ink-2); }
.small { font-size: 14px; }
.ph { display: inline-block; border: 1px dashed currentColor; border-radius: 4px; padding: 0 6px; font-size: 0.9em; opacity: 0.85; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--brand); color: #fff;
  border-radius: 5px; padding: 13px 22px; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  transition: background 0.2s, color 0.2s, transform 0.2s; border: 2px solid transparent; line-height: 1.2;
}
.btn:hover { background: var(--brand-deep); transform: translateY(-1px); }
.btn--mint { background: var(--mint); color: var(--ink); }
.btn--mint:hover { background: #fff; color: var(--ink); }
.btn--ghost { background: transparent; border-color: currentColor; }
.btn--ghost:hover { background: rgba(255, 255, 255, 0.12); }
.btn--sm { padding: 9px 16px; font-size: 12px; }
.btn[aria-disabled="true"] { background: var(--grey-2); color: var(--ink-2); pointer-events: none; }
.btns { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
.btns.center { justify-content: center; }
.link { color: var(--brand); font-weight: 700; text-decoration: underline; text-underline-offset: 4px; }

/* ---------- Bands ---------- */
.band { padding: 88px 0; }
.band--tint { background: var(--tint); }
.band--grey { background: var(--grey); }
.band--brand { background: var(--brand); color: #fff; }
.band--ink { background: var(--ink); color: #fff; }
/* Farm Fresh's wood-plank band, redrawn as a fine vertical grain in deep green. */
.band--deep, .texture-deep {
  background-color: var(--brand-deep); color: #fff;
  background-image:
    repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.028) 0 2px, transparent 2px 11px),
    repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.07) 0 1px, transparent 1px 37px),
    linear-gradient(180deg, rgba(0, 0, 0, 0.12), rgba(255, 255, 255, 0.04) 50%, rgba(0, 0, 0, 0.12));
}
/* Farm Fresh's linen strip, as a faint horizontal weave on the light neutral. */
.texture-light {
  background-color: var(--grey);
  background-image: repeating-linear-gradient(0deg, rgba(18, 53, 42, 0.022) 0 1px, transparent 1px 5px),
    repeating-linear-gradient(90deg, rgba(18, 53, 42, 0.018) 0 1px, transparent 1px 7px);
}

/* ---------- Preview note ---------- */
.pv-note { background: var(--ink); color: #dcebe1; font-size: 13px; text-align: center; padding: 8px 48px; position: relative; }
.pv-note b { color: var(--mint); }
.pv-note button { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: #fff; font-size: 18px; display: grid; place-items: center; width: 28px; height: 28px; }

/* ---------- Header ---------- */
.hdr { position: sticky; top: 0; z-index: 50; background: #fff; box-shadow: 0 2px 14px rgba(18, 53, 42, 0.08); }
.hdr__in { display: flex; align-items: center; height: var(--hdr); gap: 20px; max-width: 1320px; margin: 0 auto; padding: 0 24px; }
.hdr__logo img { height: 84px; width: auto; }
.nav { flex: 1; height: 100%; display: flex; justify-content: center; }
.nav > ul { display: flex; list-style: none; height: 100%; }
.nav > ul > li { position: relative; height: 100%; }
.nav__link { display: flex; align-items: center; gap: 4px; height: 100%; padding: 0 15px; font-size: 15px; font-weight: 600; color: var(--ink); position: relative; white-space: nowrap; }
.nav__link svg { font-size: 14px; opacity: 0.6; }
.nav__link::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 4px; background: var(--brand); transform: scaleX(0); transition: transform 0.25s var(--ease); }
.nav__link:hover, .nav__link.is-active { color: var(--brand); }
.nav__link:hover::after, .nav__link.is-active::after { transform: scaleX(1); }
.nav__menu {
  position: absolute; top: 100%; left: 0; min-width: 250px; background: #fff; box-shadow: var(--shadow); border-top: 3px solid var(--brand);
  list-style: none; padding: 8px 0; opacity: 0; visibility: hidden; transform: translateY(8px); transition: 0.2s var(--ease);
}
.nav > ul > li:hover > .nav__menu, .nav > ul > li:focus-within > .nav__menu { opacity: 1; visibility: visible; transform: none; }
.nav__menu a { display: block; padding: 9px 20px; font-size: 15px; color: var(--ink); }
.nav__menu a:hover, .nav__menu a.is-active { background: var(--tint); color: var(--brand); }
.hdr__actions { display: flex; align-items: center; gap: 10px; }
.hdr__cart { position: relative; width: 44px; height: 44px; display: grid; place-items: center; font-size: 24px; color: var(--brand); border-radius: 5px; flex: none; }
/* Shop Today swaps the corporate header for its own: logo, search, back to the main site, cart. */
.hdr__in--shop { display: none; }
.is-shop .hdr__in--site { display: none; }
.is-shop .hdr__in--shop { display: flex; }
.hdr__logo, .hdr__brand { display: flex; align-items: center; gap: 12px; flex: none; }
.shop-tag:hover { color: var(--brand-deep); }
.shop-tag { font-weight: 800; font-stretch: 75%; text-transform: uppercase; font-size: 24px; line-height: 1; color: var(--brand); border-left: 2px solid var(--line); padding-left: 12px; white-space: nowrap; }
.search { flex: 1; max-width: 640px; margin: 0 auto; display: flex; align-items: center; border: 2px solid var(--brand); border-radius: 6px; background: #fff; padding-left: 14px; overflow: hidden; }
.search:focus-within { box-shadow: 0 0 0 4px rgba(0, 103, 71, 0.16); }
.search__icon { display: grid; font-size: 20px; color: var(--brand); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; padding: 12px; font-size: 16px; }
.search input::placeholder { color: #7a8580; }
.search .btn { align-self: stretch; border-radius: 0; padding: 0 22px; }
.search .btn:hover { transform: none; }
.hdr__back { display: inline-flex; align-items: center; gap: 6px; flex: none; padding: 10px 14px; border: 2px solid var(--line); border-radius: 6px; font-size: 15px; font-weight: 600; color: var(--brand); white-space: nowrap; }
.hdr__back:hover { border-color: var(--brand); background: var(--tint); }
.shop-status { text-align: center; color: var(--ink-2); margin: -16px 0 24px; font-size: 15px; }
.shop-status button { margin-left: 10px; font-size: inherit; }
.hdr__cart:hover { background: var(--tint); }
.hdr__cart b { position: absolute; top: 2px; right: 0; min-width: 20px; height: 20px; border-radius: 10px; background: var(--brand); color: #fff; font-size: 11px; display: grid; place-items: center; padding: 0 5px; }
.hdr__burger { display: none; width: 44px; height: 44px; place-items: center; font-size: 26px; color: var(--ink); }

/* ---------- Drawers ---------- */
.drawer { position: fixed; inset: 0; z-index: 90; visibility: hidden; }
.drawer.is-open { visibility: visible; }
.drawer__scrim { position: absolute; inset: 0; background: rgba(18, 53, 42, 0.5); opacity: 0; transition: opacity 0.25s; }
.drawer.is-open .drawer__scrim { opacity: 1; }
.drawer__panel { position: absolute; top: 0; right: 0; bottom: 0; width: min(380px, 90vw); background: #fff; transform: translateX(100%); transition: transform 0.3s var(--ease); display: flex; flex-direction: column; }
.drawer.is-open .drawer__panel { transform: none; }
.drawer__head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--grey-2); }
.drawer__head h2 { font-size: 26px; color: var(--brand); }
.drawer__close { width: 40px; height: 40px; display: grid; place-items: center; font-size: 22px; }
.drawer__body { flex: 1; overflow: auto; padding: 12px 20px 24px; }
.mnav a, .mnav summary { display: flex; align-items: center; justify-content: space-between; padding: 13px 0; font-size: 17px; font-weight: 600; border-bottom: 1px solid var(--grey-2); cursor: pointer; list-style: none; }
.mnav summary::-webkit-details-marker { display: none; }
.mnav details[open] summary svg { transform: rotate(180deg); }
.mnav details div a { font-size: 15px; font-weight: 400; padding: 10px 0 10px 16px; }
.mnav a.is-active, .mnav summary.is-active { color: var(--brand); }
.mnav .btn { margin-top: 20px; width: 100%; border-bottom: 0; justify-content: center; }

/* ---------- Footer ---------- */
.ftr { background: var(--ink); color: #cfe3d8; font-size: 15px; }
.ftr__top { display: grid; grid-template-columns: 1.4fr repeat(3, 1fr); gap: 32px; padding: 48px 24px 36px; max-width: 1320px; margin: 0 auto; }
.ftr__brand img { height: 52px; width: auto; background: #fff; border-radius: 6px; padding: 4px 8px; }
.ftr__brand p { margin-top: 14px; line-height: 1.6; }
.ftr__brand a { color: #fff; }
.ftr h3 { font-size: 15px; color: var(--mint); margin-bottom: 10px; }
.ftr ul { list-style: none; display: grid; gap: 6px; }
.ftr ul a:hover { color: #fff; text-decoration: underline; }
.ftr__bar { border-top: 1px solid rgba(255, 255, 255, 0.12); }
.ftr__bar > div { display: flex; flex-wrap: wrap; gap: 10px 20px; justify-content: space-between; align-items: center; padding: 16px 24px; max-width: 1320px; margin: 0 auto; font-size: 13px; }
.ftr__legal a { color: var(--mint); }
.ftr__social { display: flex; gap: 8px; }
.ftr__social a { width: 34px; height: 34px; display: grid; place-items: center; font-size: 18px; border-radius: 50%; background: rgba(255, 255, 255, 0.08); color: #fff; }
.ftr__social a:hover { background: var(--brand); }

/* ---------- Floating buttons (Farm Fresh's back-to-top and mail) ---------- */
.fab { position: fixed; right: 16px; bottom: 16px; display: flex; gap: 8px; z-index: 40; }
.fab a, .fab button { width: 42px; height: 42px; display: grid; place-items: center; background: #fff; border: 1px solid var(--line); border-radius: 5px; color: var(--brand); font-size: 20px; box-shadow: 0 4px 14px rgba(18, 53, 42, 0.12); }
.fab a:hover, .fab button:hover { background: var(--brand); color: #fff; }

/* ---------- Home: hero slider ---------- */
.slider { position: relative; background: #e9ecea; overflow: hidden; }
.slider__track { display: flex; transition: transform 0.7s var(--ease); }
.slide { flex: 0 0 100%; aspect-ratio: 2048 / 878; }
.slide img { width: 100%; height: 100%; object-fit: cover; }
.slider__arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 42px; height: 42px; display: grid; place-items: center; background: rgba(18, 53, 42, 0.72); color: #fff; font-size: 22px; border-radius: 4px; }
.slider__arrow:hover { background: var(--brand); }
.slider__arrow--prev { left: 16px; }
.slider__arrow--next { right: 16px; }
.slider__dots { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
.slider__dots button { width: 10px; height: 10px; border-radius: 5px; background: rgba(255, 255, 255, 0.85); box-shadow: 0 0 0 1px rgba(18, 53, 42, 0.3); transition: width 0.3s; }
.slider__dots button[aria-current="true"] { background: var(--brand); width: 28px; }

/* ---------- Stats ---------- */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin: 48px 0 40px; }
.stat { padding: 32px 18px; border-radius: 8px; background: var(--grey); text-align: center; }
.stat b { display: block; font-size: 72px; font-weight: 800; font-stretch: 75%; color: var(--brand); line-height: 1; }
.stat span { display: block; margin-top: 8px; color: var(--ink-2); }
.band--brand .stat, .band--deep .stat { background: rgba(255, 255, 255, 0.08); }
.band--brand .stat b, .band--deep .stat b { color: var(--mint); }
.band--brand .stat span { color: #e3f1e9; }

/* ---------- Product cards and carousel ---------- */
.pcard { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 16px 12px 20px; border-radius: 10px; transition: background 0.25s; }
.pcard:hover { background: rgba(255, 255, 255, 0.55); }
.pcard__img { height: 230px; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
.pcard__img img { max-height: 100%; width: auto; object-fit: contain; filter: drop-shadow(0 14px 16px rgba(18, 53, 42, 0.2)); transition: transform 0.35s var(--ease); }
.pcard:hover .pcard__img img { transform: translateY(-6px) rotate(-2deg); }
.pcard__name { font-size: 19px; color: var(--ink); margin-top: 8px; }
.pcard__meta { font-size: 14px; color: var(--ink-2); }
.pcard .btn { margin-top: 6px; }
.carousel { position: relative; margin-top: 44px; }
.carousel__track { display: grid; grid-auto-flow: column; grid-auto-columns: calc((100% - 48px) / 3); gap: 24px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; scroll-behavior: smooth; }
.carousel__track::-webkit-scrollbar { display: none; }
.carousel__track > * { scroll-snap-align: start; }
.carousel__arrow { position: absolute; top: 120px; width: 44px; height: 44px; display: grid; place-items: center; font-size: 22px; border-radius: 4px; background: var(--ink); color: #fff; z-index: 2; }
.carousel__arrow:hover { background: var(--brand); }
.carousel__arrow[disabled] { opacity: 0.25; cursor: default; }
.carousel__arrow--prev { left: -64px; }
.carousel__arrow--next { right: -64px; }

/* ---------- Pillars (Mudah / Sedap / Selamat) ---------- */
.pillars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 52px; text-align: left; }
.pillar { padding: 28px 26px; border-radius: 8px; background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(168, 224, 198, 0.25); }
.pillar b { display: block; font-size: 56px; font-weight: 800; font-stretch: 75%; color: var(--mint); line-height: 1; }
.pillar h3 { font-size: 21px; margin: 12px 0 6px; color: #fff; }

/* ---------- Photo band ---------- */
.photo-band { height: clamp(260px, 38vw, 520px); background-size: cover; background-position: center; }

/* ---------- Polaroids (Farm Fresh's pinned photos) ---------- */
.polaroids { display: flex; flex-wrap: wrap; justify-content: center; gap: 34px 30px; margin-top: 60px; }
.polaroid { position: relative; width: 250px; background: #fff; padding: 10px 10px 16px; box-shadow: 0 14px 30px rgba(18, 53, 42, 0.2); transform: rotate(var(--r, -3deg)); transition: transform 0.3s var(--ease); text-align: center; }
.polaroid:hover { transform: rotate(0) scale(1.04); }
.polaroid::before { content: ""; position: absolute; top: -10px; left: 50%; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #5fd0a0, var(--brand) 55%, var(--brand-deep)); box-shadow: 0 3px 5px rgba(0, 0, 0, 0.35); z-index: 1; }
.polaroid img { width: 100%; aspect-ratio: 1; object-fit: cover; }
.polaroid__cap { display: block; padding-top: 12px; font-weight: 600; }
.polaroid__kind { display: block; font-size: 13px; color: var(--ink-2); font-weight: 400; }
.polaroid__play { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); width: 58px; height: 58px; border-radius: 50%; background: rgba(0, 103, 71, 0.9); color: #fff; display: grid; place-items: center; font-size: 22px; }
.polaroid__play svg { margin-left: 3px; }

/* ---------- Home IPO band ---------- */
.ipo { display: grid; grid-template-columns: 1.1fr 1fr; gap: 56px; align-items: center; }
.figs { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px dashed rgba(168, 224, 198, 0.5); }
.figs > div { padding: 22px 8px; border-bottom: 1px dashed rgba(168, 224, 198, 0.5); }
.figs > div:nth-child(odd) { border-right: 1px dashed rgba(168, 224, 198, 0.5); padding-right: 20px; }
.figs > div:nth-child(even) { padding-left: 24px; }
.figs dt { font-size: 14px; color: #d4eadf; }
.figs dd { font-size: 32px; font-weight: 800; font-stretch: 75%; color: var(--mint); line-height: 1.1; margin-top: 4px; }

/* ---------- Page banner (Farm Fresh's "Let's get fresh!" strip) ---------- */
.pbanner { padding: 44px 0; }
.pbanner__in { display: grid; grid-template-columns: 1fr auto 1fr; gap: 36px; align-items: center; }
.pbanner__title { font-size: clamp(44px, 6vw, 84px); color: var(--brand); transform: rotate(-4deg); line-height: 0.95; }
.pbanner__img { height: 170px; width: auto; filter: drop-shadow(0 14px 16px rgba(18, 53, 42, 0.22)); transform: rotate(6deg); }
.pbanner__text { font-size: 17px; color: var(--ink-2); max-width: 400px; }

/* ---------- Chips / tab strips ---------- */
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 40px; }
.chip { padding: 10px 18px; border-radius: 999px; background: var(--grey); font-size: 15px; font-weight: 600; color: var(--ink); border: 2px solid transparent; transition: background 0.2s; }
.chip:hover { background: var(--tint); }
.chip[aria-selected="true"], .chip[aria-pressed="true"] { background: var(--brand); color: #fff; }
/* Farm Fresh's text tabs: "Financial Highlights | Financial Performance | ..." */
.textabs { display: flex; flex-wrap: wrap; justify-content: center; row-gap: 10px; font-size: 16px; }
.textabs > * { padding: 2px 16px; border-right: 1px solid rgba(18, 53, 42, 0.35); line-height: 1.3; color: var(--ink-2); font-weight: 500; }
.textabs > *:last-child { border-right: 0; }
.textabs > *:hover { color: var(--brand); }
.textabs > [aria-selected="true"], .textabs > .is-active { color: var(--brand); font-weight: 700; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 7px; }

/* ---------- Product grid ---------- */
.pgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 36px 24px; }
.pgrid .pcard[hidden] { display: none; }

/* ---------- Product detail ---------- */
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 14px; color: var(--ink-2); padding: 22px 0 0; }
.crumbs a { color: var(--brand); }
.crumbs a:hover { text-decoration: underline; }
.crumbs svg { font-size: 12px; }
.pdp { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: start; padding: 32px 0 80px; }
.pdp__media { position: relative; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 50% 45%, #fff 0, var(--tint) 62%); display: grid; place-items: center; }
.pdp__media img { max-height: 78%; max-width: 78%; object-fit: contain; filter: drop-shadow(0 22px 22px rgba(18, 53, 42, 0.25)); }
.pdp__note { position: absolute; bottom: 4%; left: 50%; transform: translateX(-50%); font-size: 13px; background: #fff; border-radius: 999px; padding: 4px 12px; color: var(--ink-2); white-space: nowrap; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); }
.pdp__note[hidden] { display: none; }
.pdp h1 { font-size: clamp(40px, 4.6vw, 64px); color: var(--brand); }
.pdp__names { margin-top: 14px; color: var(--ink-2); font-size: 17px; }
.pdp__packs { display: flex; flex-wrap: wrap; gap: 8px; margin: 26px 0 8px; }
.pdp__packs .chip { font-size: 14px; padding: 8px 14px; }
.specs { width: 100%; border-collapse: collapse; margin-top: 22px; font-size: 15px; }
.specs th, .specs td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--grey-2); vertical-align: top; }
.specs th { width: 38%; background: var(--grey); font-weight: 600; }
.specs td { font-variant-numeric: tabular-nums; }

/* ---------- About: story chapters ---------- */
.story-intro { display: grid; grid-template-columns: 1.2fr 1fr; gap: 56px; align-items: center; }
.story-intro p { font-size: 19px; margin-top: 22px; }
.story-intro mark { background: none; color: var(--brand); font-weight: 700; }
.frame { background: #fff; padding: 12px; box-shadow: var(--shadow); transform: rotate(2deg); }
.frame img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.chapters-nav { padding: 28px 0; background: #fff; border-bottom: 1px solid var(--grey-2); }
.chapter { padding: 80px 0; }
.chapter[hidden] { display: none; }
.chapter__in { display: grid; grid-template-columns: 1.1fr 1fr; gap: 56px; align-items: center; }
.chapter__label { font-size: clamp(80px, 11vw, 150px); font-weight: 800; font-stretch: 75%; line-height: 0.9; color: var(--brand); }
.chapter h2 { font-size: clamp(30px, 3.4vw, 44px); margin: 14px 0 16px; color: var(--ink); }
.chapter p { font-size: 18px; max-width: 520px; }
.chapter--tint { background: var(--tint); }
.chapter--brand { background: var(--brand); color: #fff; }
.chapter.on-dark .chapter__label { color: var(--mint); }
.chapter.on-dark h2 { color: #fff; }
.chapter__media { display: grid; place-items: center; min-height: 320px; }
.chapter__media > img { max-height: 340px; width: auto; filter: drop-shadow(0 20px 22px rgba(0, 0, 0, 0.25)); transform: rotate(-4deg); }
.collage { display: grid; grid-template-columns: 1fr 1fr; gap: 26px 22px; }
.collage .polaroid { width: 100%; max-width: 200px; }
.collage .polaroid img { object-fit: contain; background: var(--grey); padding: 8px; }
.badge-disc { width: 280px; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; text-align: center; background: radial-gradient(circle at 35% 30%, #f6f9f7, #cfe0d5); color: var(--brand-deep); box-shadow: 0 0 0 10px rgba(168, 224, 198, 0.35), var(--shadow); padding: 30px; }
.badge-disc b { display: block; font-size: 64px; font-weight: 800; font-stretch: 75%; line-height: 0.9; }
.badge-disc span { display: block; font-weight: 700; margin-top: 8px; letter-spacing: 0.06em; text-transform: uppercase; font-size: 14px; }
.future { border: 3px dashed var(--brand); border-radius: 14px; padding: 36px; max-width: 380px; color: var(--brand); text-align: center; }
.future b { display: block; font-size: 30px; font-weight: 800; font-stretch: 75%; text-transform: uppercase; }
.chapter__pager { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
.trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 48px; }
.trio > div { text-align: center; }
.trio b { display: block; font-size: clamp(48px, 6vw, 80px); font-weight: 800; font-stretch: 75%; text-transform: uppercase; color: var(--mint); line-height: 1; }
.trio p { margin-top: 12px; }
.certs { background: #fff; border-radius: 10px; padding: 18px; margin-top: 40px; box-shadow: 0 2px 10px rgba(18, 53, 42, 0.06); }
.certs img { margin: 0 auto; max-height: 120px; width: auto; }

/* ---------- About: business ---------- */
.biz { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; margin-top: 48px; }
.biz__card { display: grid; grid-template-columns: 1fr 160px; gap: 20px; align-items: center; padding: 30px; border-radius: 10px; background: var(--grey); }
.biz__card b { font-size: 48px; font-weight: 800; font-stretch: 75%; color: var(--brand); line-height: 1; }
.biz__card h3 { font-size: 22px; margin: 8px 0; }
.biz__card img { max-height: 150px; margin: 0 auto; filter: drop-shadow(0 10px 12px rgba(18, 53, 42, 0.2)); }
.photo-ph { aspect-ratio: 1; border: 2px dashed rgba(18, 53, 42, 0.35); border-radius: 8px; display: grid; place-items: center; text-align: center; font-size: 13px; color: var(--ink-2); padding: 10px; }
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 20px; margin-top: 44px; }
.ir-page .people { margin-top: 0; }
.person { background: #fff; border-radius: 10px; padding: 26px 20px; text-align: center; box-shadow: 0 2px 12px rgba(18, 53, 42, 0.08); border-top: 4px solid var(--brand); }
.person__avatar { width: 84px; height: 84px; margin: 0 auto 14px; border-radius: 50%; display: grid; place-items: center; background: var(--tint); color: var(--brand); font-size: 30px; font-weight: 800; font-stretch: 75%; }
.person h3 { font-size: 18px; }
.person p { font-size: 14px; color: var(--ink-2); margin-top: 6px; }
.alsolike { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.alsolike a { padding: 36px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; gap: 16px; color: #fff; }
.alsolike a:hover { filter: brightness(1.08); }
.alsolike h3 { font-size: 26px; }
.alsolike svg { font-size: 28px; }
.alsolike .eyebrow { color: var(--mint); }

/* ---------- Outlets ---------- */
.outlets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.outlet { background: #fff; border-radius: 10px; padding: 24px; box-shadow: 0 2px 12px rgba(18, 53, 42, 0.08); border-left: 4px solid var(--brand); display: flex; flex-direction: column; gap: 8px; }
.outlet h3 { font-size: 18px; }
.outlet p, .outlet a { display: flex; gap: 8px; font-size: 15px; color: var(--ink-2); align-items: flex-start; }
.outlet svg { margin-top: 4px; color: var(--brand); }
.outlet a { color: var(--brand); font-weight: 600; }
.outlet a:hover { text-decoration: underline; }
.note { margin-top: 28px; padding: 16px 20px; border-radius: 8px; background: var(--tint); font-size: 15px; }

/* ---------- Shop ---------- */
.trust { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-top: 36px; text-align: left; }
.trust > div { display: flex; gap: 12px; align-items: center; background: rgba(255, 255, 255, 0.08); border-radius: 8px; padding: 14px 16px; }
.trust svg { font-size: 28px; color: var(--mint); }
.trust b { display: block; color: #fff; font-size: 15px; }
.trust span { font-size: 13px; color: #d4eadf; }
.promos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.promos a { position: relative; border-radius: 10px; overflow: hidden; display: block; }
.promos img { width: 100%; aspect-ratio: 1; object-fit: cover; transition: transform 0.4s var(--ease); }
.promos a:hover img { transform: scale(1.04); }
.promos span { position: absolute; left: 14px; bottom: 14px; background: #fff; color: var(--brand); border-radius: 5px; padding: 8px 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
.scard { background: #fff; border-radius: 10px; padding: 18px 18px 20px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 2px 12px rgba(18, 53, 42, 0.08); position: relative; }
.scard[hidden] { display: none; }
.scard__img { height: 190px; display: grid; place-items: center; background: var(--grey); border-radius: 8px; }
.scard__img img { max-height: 160px; width: auto; filter: drop-shadow(0 10px 12px rgba(18, 53, 42, 0.18)); }
.scard__badge { position: absolute; top: 28px; left: 28px; background: var(--mint); color: var(--ink); font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; z-index: 1; }
.scard h3 { font-size: 17px; }
.scard select { border: 1px solid #c8d1cc; border-radius: 5px; padding: 9px 10px; background: #fff; }
.scard__row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; }
.price { font-size: 24px; font-weight: 800; font-stretch: 75%; color: var(--brand); font-variant-numeric: tabular-nums; }
.sgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; }
.bundles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; margin-top: 44px; }
.bundle { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(168, 224, 198, 0.3); border-radius: 10px; padding: 26px; display: flex; flex-direction: column; gap: 10px; }
.bundle img { height: 150px; width: auto; margin: 0 auto 8px; filter: drop-shadow(0 12px 14px rgba(0, 0, 0, 0.3)); }
.bundle h3 { font-size: 22px; color: #fff; }
.bundle .price { color: var(--mint); }
.cart-line { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--grey-2); }
.cart-line img { width: 64px; height: 64px; object-fit: contain; background: var(--grey); border-radius: 6px; padding: 4px; }
.cart-line b { display: block; font-size: 15px; line-height: 1.3; }
.cart-line small { color: var(--ink-2); }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--grey-2); border-radius: 5px; margin-top: 6px; }
.qty button { width: 30px; height: 30px; display: grid; place-items: center; font-size: 15px; }
.qty span { min-width: 26px; text-align: center; font-variant-numeric: tabular-nums; font-size: 14px; }
.cart-foot { border-top: 1px solid var(--grey-2); padding: 18px 20px 22px; }
.cart-foot .row { display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; margin-bottom: 14px; }
.cart-foot .btn { width: 100%; }

/* ---------- Sustainability ---------- */
.hero-photo { position: relative; min-height: 460px; display: flex; align-items: flex-end; background-size: cover; background-position: center; }
.hero-photo::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0, 74, 51, 0.25), rgba(0, 74, 51, 0.88)); }
.hero-photo .wrap { position: relative; width: 100%; padding-top: 80px; padding-bottom: 56px; color: #fff; }
.hero-photo h1 { font-size: clamp(42px, 6vw, 84px); max-width: 900px; }
.hero-photo p { font-size: 19px; max-width: 660px; margin-top: 18px; }
.commit { display: grid; grid-template-columns: 1fr 400px; gap: 56px; align-items: center; }
.commit p + p { margin-top: 14px; }
.commit .title { margin-bottom: 22px; }
.pillar-tabs { display: grid; gap: 8px; margin-top: 28px; }
.pillar-tabs button { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 8px; background: var(--grey); text-align: left; font-weight: 600; font-size: 16px; border: 2px solid transparent; }
.pillar-tabs button b { font-size: 26px; font-weight: 800; font-stretch: 75%; color: var(--brand); min-width: 34px; }
.pillar-tabs button:hover { background: var(--tint); }
.pillar-tabs button[aria-selected="true"] { background: #fff; border-color: var(--brand); box-shadow: 0 4px 14px rgba(18, 53, 42, 0.1); }
.ring { width: 100%; max-width: 400px; margin: 0 auto; display: block; }
.ring path { cursor: pointer; transition: opacity 0.25s; }
.ring path.is-dim { opacity: 0.28; }
.ring text { font-family: var(--font); }
.pillar-panel { padding: 80px 0; }
.pillar-panel[hidden] { display: none; }
.pillar-panel__in { display: grid; grid-template-columns: 1.15fr 1fr; gap: 56px; align-items: start; }
.pillar-panel h2 { font-size: clamp(32px, 3.6vw, 48px); margin-bottom: 18px; }
.pillar-panel .intro { font-size: 19px; font-weight: 600; margin-bottom: 14px; }
.pillar-panel p + p { margin-top: 12px; }
.hl { display: grid; gap: 14px; }
.hl > div { padding: 20px 22px; border-radius: 8px; background: rgba(255, 255, 255, 0.6); }
.on-dark .hl > div { background: rgba(255, 255, 255, 0.08); }
.hl h3 { font-size: 18px; margin-bottom: 4px; }
.on-dark .hl h3 { color: var(--mint); }
.pstats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 22px; }
.pstats > div { border: 1px dashed currentColor; border-radius: 8px; padding: 14px; font-size: 14px; }
.pstats b { display: block; font-size: 20px; font-weight: 800; font-stretch: 75%; }
.tone-brand { background: var(--brand); color: #fff; }
.tone-sand { background: var(--sand); }
.tone-saffron { background: var(--mint); }
.tone-ink { background: var(--ink); color: #fff; }
.tone-sand .eyebrow, .tone-saffron .eyebrow, .tone-sand h2, .tone-saffron h2 { color: var(--brand-deep); }
.pillar-panel img.pack { max-height: 280px; margin: 24px auto 0; filter: drop-shadow(0 16px 18px rgba(0, 0, 0, 0.25)); }
.report-card { display: flex; gap: 20px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: #fff; border-radius: 10px; padding: 24px 28px; margin-top: 32px; box-shadow: 0 2px 12px rgba(18, 53, 42, 0.08); }
.report-card > div { display: flex; gap: 16px; align-items: center; }
.report-card .big { font-size: 40px; color: var(--brand); }

/* ---------- IR ---------- */
.ir-hero { position: relative; height: 360px; display: flex; align-items: flex-end; background-size: cover; background-position: center 40%; }
.ir-hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0, 74, 51, 0.2), rgba(0, 74, 51, 0.86)); }
.ir-hero .wrap { position: relative; width: 100%; padding-bottom: 36px; color: #fff; }
.ir-hero h1 { font-size: clamp(40px, 5.4vw, 72px); }
.ir-hero__badges { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.ir-hero__badges span { border: 1px solid rgba(168, 224, 198, 0.6); border-radius: 999px; padding: 5px 14px; font-size: 14px; }
.ir-hero__badges span:first-child { background: var(--mint); color: var(--ink); border-color: var(--mint); font-weight: 700; }
.ticker { background: var(--brand); color: #fff; font-size: 14px; }
.ticker ul { display: flex; list-style: none; overflow-x: auto; scrollbar-width: none; max-width: 1320px; margin: 0 auto; }
.ticker ul::-webkit-scrollbar { display: none; }
.ticker li { flex: 1 0 auto; padding: 12px 20px; border-right: 1px solid rgba(168, 224, 198, 0.4); white-space: nowrap; text-align: center; }
.ticker li:last-child { border-right: 0; }
.ticker b { color: var(--mint); font-weight: 700; margin-right: 6px; }
.irmenu { background: #fff; border-bottom: 1px solid var(--grey-2); }
.irmenu ul { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; list-style: none; max-width: 1240px; margin: 0 auto; padding: 22px 20px; }
.irmenu a { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 4px; border-radius: 6px; font-size: 13px; line-height: 1.25; text-align: center; color: var(--ink); height: 100%; }
.irmenu svg { font-size: 34px; color: var(--brand); stroke-width: 1.5; }
.irmenu a:hover { background: var(--tint); }
.irmenu a.is-active { background: var(--mint); font-weight: 700; }
.ir-page { padding: 36px 0 80px; }
.ir-page--home { padding-bottom: 72px; }
.ir-page__head { text-align: center; margin: 34px auto 40px; max-width: 760px; }
.ir-page__head h2 { font-size: clamp(32px, 3.8vw, 48px); color: var(--brand); }
.ir-page__head p { margin-top: 12px; color: var(--ink-2); font-size: 17px; }
.ir-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
.card { background: var(--grey); border-radius: 8px; padding: 32px; }
.card--white { background: #fff; box-shadow: 0 2px 14px rgba(18, 53, 42, 0.08); }
.card__title { font-size: 26px; text-align: center; margin-bottom: 20px; }
.rows { list-style: none; }
.rows li { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 16px 0; border-bottom: 1px dashed rgba(18, 53, 42, 0.28); }
.rows li:first-child { padding-top: 4px; }
.rows b { display: block; font-size: 16px; line-height: 1.35; }
.rows small { display: block; color: var(--brand); font-weight: 600; font-size: 14px; margin-bottom: 2px; }
.rows .act { white-space: nowrap; font-size: 14px; color: var(--ink-2); }
.card .btns { justify-content: center; margin-top: 24px; }
.glance { color: #fff; background-size: cover; background-position: center; }
.glance .card__title { color: #fff; }
.glance__grid { display: grid; grid-template-columns: 1fr 1fr; }
.glance__grid > div { padding: 22px 12px; text-align: center; }
.glance__grid > div:nth-child(1), .glance__grid > div:nth-child(2) { border-bottom: 1px dashed rgba(255, 255, 255, 0.45); }
.glance__grid > div:nth-child(odd) { border-right: 1px dashed rgba(255, 255, 255, 0.45); }
.glance__grid span { display: block; font-size: 17px; color: #e3f1e9; }
.glance__grid b { display: block; font-size: 44px; font-weight: 800; font-stretch: 75%; color: var(--mint); line-height: 1.05; margin-top: 4px; }
.glance__grid small { display: block; font-size: 13px; color: #d4eadf; }
.glance__note { text-align: center; font-size: 13px; color: #d4eadf; margin-top: 12px; }
.calband { position: relative; padding: 64px 0; background-size: cover; background-position: center; }
.calband::before { content: ""; position: absolute; inset: 0; background: rgba(239, 239, 234, 0.93); }
.calband .wrap { position: relative; }
.calband h2, .ircontact h2 { font-size: 36px; color: var(--ink); text-transform: none; font-stretch: 100%; font-weight: 700; }
.cal { list-style: none; margin-top: 18px; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px 32px; }
.cal li { padding: 10px 0; border-bottom: 1px solid rgba(18, 53, 42, 0.15); }
.cal small { display: block; font-size: 14px; color: var(--brand); font-weight: 600; }
.cal b { font-size: 17px; }
.alerts { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: center; }
.alerts__art .frame { transform: rotate(-2deg); }
.alerts__art .frame img { aspect-ratio: auto; object-fit: contain; }
.ircontact { background: var(--grey); padding: 56px 0; text-align: center; }
.ircontact ul { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px 52px; margin-top: 26px; list-style: none; }
.ircontact li { display: flex; align-items: center; gap: 12px; font-weight: 600; flex-wrap: wrap; justify-content: center; }
.ircontact li svg { font-size: 30px; color: var(--brand); }
.ircontact a:hover { color: var(--brand); text-decoration: underline; }
.disclaimer { font-size: 13px; color: var(--ink-2); max-width: 900px; margin: 22px auto 0; }
.pager { display: flex; justify-content: space-between; gap: 16px; margin-top: 56px; padding-top: 24px; border-top: 1px solid var(--grey-2); }
.pager a { display: flex; align-items: center; gap: 10px; color: var(--brand); font-weight: 600; max-width: 48%; }
.pager a:hover { text-decoration: underline; }
.pager small { display: block; color: var(--ink-2); font-weight: 400; font-size: 13px; }
.pager .next { margin-left: auto; text-align: right; }
.kv { width: 100%; border-collapse: collapse; font-size: 16px; }
.kv th, .kv td { text-align: left; padding: 14px 18px; vertical-align: top; border-bottom: 1px solid var(--grey-2); }
.kv th { width: 34%; background: var(--grey); font-weight: 600; }
.tbl-wrap { overflow-x: auto; border-radius: 8px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 15px; min-width: 560px; }
.tbl thead th { background: var(--brand); color: #fff; text-align: right; padding: 14px 16px; font-weight: 700; white-space: nowrap; }
.tbl thead tr.sub th { background: var(--ink); font-weight: 500; font-size: 13px; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl td { padding: 13px 16px; text-align: right; border-bottom: 1px solid var(--grey-2); font-variant-numeric: tabular-nums; }
.tbl tbody tr:nth-child(even) { background: var(--grey); }
.tbl tr.subline td { color: var(--ink-2); font-size: 14px; }
.tbl tr.subline td:first-child { padding-left: 32px; }
.chart-box { background: #fff; border-radius: 8px; padding: 24px; box-shadow: 0 2px 14px rgba(18, 53, 42, 0.08); margin-bottom: 28px; }
.chart-box__top { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.chart-box h3 { font-size: 20px; }
.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--font); font-size: 13px; fill: var(--ink-2); }
.chart .val { font-weight: 700; fill: var(--ink); font-size: 15px; }
.pills { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.pills button { padding: 7px 14px; border-radius: 5px; background: var(--grey); font-weight: 600; font-size: 14px; }
.pills button[aria-pressed="true"] { background: var(--brand); color: #fff; }
.docs { display: grid; gap: 12px; }
.doc { display: grid; grid-template-columns: 48px 1fr auto; gap: 16px; align-items: center; background: #fff; border-radius: 8px; padding: 16px 20px; box-shadow: 0 1px 8px rgba(18, 53, 42, 0.07); }
.doc[hidden] { display: none; }
.doc > svg { font-size: 32px; color: var(--brand); stroke-width: 1.5; }
.doc b { display: block; line-height: 1.35; }
.doc small { color: var(--ink-2); }

    <button class="carousel__arrow carousel__arrow--prev" type="button" data-prev aria-label="Previous products">${ic('chevL')}</button>
    <div class="carousel__track" tabindex="0" role="region" aria-label="${label}">${products.map((p) => productCard(p)).join('')}</div>
    <button class="carousel__arrow carousel__arrow--next" type="button" data-next aria-label="Next products">${ic('chevR')}</button>
  </div>`;
}
function textTabs(items, current) {
  return `<div class="textabs" role="tablist">${items.map(([id, label]) => `<button type="button" role="tab" data-tab="${id}" aria-selected="${id === current}">${label}</button>`).join('')}</div>`;
}
function person([name, role, extra]) {
  return `<article class="person"><div class="person__avatar" aria-hidden="true">${initials(name)}</div><h3>${name}</h3><p>${role}</p>${extra ? `<p>${extra}</p>` : ''}</article>`;
}
function emptyState(icon, title, text) {
  return `<div class="empty">${ic(icon)}<h3>${title}</h3><p>${text}</p></div>`;
}
function doc(title, meta, tag = 'Coming soon', icon = 'report') {
  return `<div class="doc">${ic(icon)}<div><b>${title}</b><small>${meta}</small></div><span class="tag">${tag}</span></div>`;

function ringSvg() {
  const cx = 200; const cy = 200; const r = 150; const w = 58; const gap = 1.6;
  const pt = (deg, rad) => [cx + rad * Math.cos(((deg - 90) * Math.PI) / 180), cy + rad * Math.sin(((deg - 90) * Math.PI) / 180)].map((n) => n.toFixed(2));
  const seg = (a0, a1) => {
    const ro = r + w / 2; const ri = r - w / 2;
    const [x0, y0] = pt(a0, ro); const [x1, y1] = pt(a1, ro); const [x2, y2] = pt(a1, ri); const [x3, y3] = pt(a0, ri);
    return `M${x0} ${y0}A${ro} ${ro} 0 0 1 ${x1} ${y1}L${x2} ${y2}A${ri} ${ri} 0 0 0 ${x3} ${y3}Z`;
  };
  const step = 360 / SUS_PILLARS.length;
  return `<svg class="ring" viewBox="0 0 400 400" role="img" aria-label="Five pillars around sustainable outcomes">
    ${SUS_PILLARS.map((p, i) => { const [tx, ty] = pt(i * step + step / 2, r); const dark = ['brand', 'deep', 'ink'].includes(p.tone);
      return `<path d="${seg(i * step + gap, (i + 1) * step - gap)}" fill="${TONE_COLOUR[p.tone]}" data-goto="${p.id}" data-seg="${p.id}"><title>${p.n} ${p.short}</title></path><text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="central" font-size="28" font-weight="800" fill="${dark ? '#fff' : '#12352a'}" pointer-events="none" style="font-stretch:75%">${p.n}</text>`; }).join('')}
    <text x="200" y="188" text-anchor="middle" font-size="30" font-weight="800" fill="#006747" style="font-stretch:75%">SUSTAINABLE</text>
    <text x="200" y="222" text-anchor="middle" font-size="30" font-weight="800" fill="#006747" style="font-stretch:75%">OUTCOMES</text>
  </svg>`;
}

function finTable(keys) {

function chartSvg(key) {
  const values = FIN[key].values; const max = 200000;
  const W = 720; const H = 300; const left = 56; const bottom = 40; const top = 28; const plotH = H - bottom - top; const bw = 120; const span = (W - left) / values.length;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${FIN[key].label} by financial year: ${values.map((v, i) => `${FY[i]} ${rm(v)}`).join(', ')}">
    ${[0, 50000, 100000, 150000, 200000].map((t) => { const y = top + plotH - (t / max) * plotH; return `<line x1="${left}" x2="${W}" y1="${y}" y2="${y}" stroke="#e2e3dc"/><text x="${left - 10}" y="${y + 4}" text-anchor="end">${t / 1000}</text>`; }).join('')}
    ${values.map((v, i) => { const h = (v / max) * plotH; const x = left + span * i + (span - bw) / 2; const y = top + plotH - h; const isLast = i === values.length - 1;
      return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="4" fill="${isLast ? '#006747' : '#a8e0c6'}"/><text class="val" x="${x + bw / 2}" y="${y - 8}" text-anchor="middle">${rm(v)}</text><text x="${x + bw / 2}" y="${H - 14}" text-anchor="middle">${FY[i]}</text>`; }).join('')}
    <text x="${left - 10}" y="14" text-anchor="end">RM m</text>
  </svg>`;
}

   ===================================================================================== */
let cleanups = [];
let lastRoute = { key: '', section: '' };
function parseHash() {
  const raw = location.hash.replace(/^#\/?/, '');
  const [path, qs = ''] = raw.split('?');
  return { parts: path.split('/').filter(Boolean), query: Object.fromEntries(new URLSearchParams(qs)) };
}
function resolve(parts, query) {
  const head = parts[0] || '';
  if (head === '') return ['home', 'Bestari Food Berhad | Mudah dan Sedap!', pageHome()];
  if (head === 'about') return parts[1] === 'business' ? ['about', 'Our Business', pageAboutBusiness()] : ['about', 'Our Story', pageAboutStory()];
  if (head === 'products' && parts[1]) { const p = PRODUCTS.find((x) => x.slug === parts[1]); return ['products', p ? p.name : 'Not found', pageProduct(parts[1])]; }
  if (head === 'products') return ['products', 'Products', pageProducts(query)];
  if (head === 'shop') return ['shop', 'Shop Today', pageShop()];
  if (head === 'onsite-outlets') return ['outlets', 'Onsite Outlets', pageOutlets(query)];
  if (head === 'sustainability') return ['sustainability', 'Sustainability', pageSustainability()];
  if (head === 'ir') { const s = IRS.find((x) => x.slug === (parts[1] || '')); return ['ir', s && s.slug ? s.label : 'Investor Relations', pageIr(parts)]; }
  return ['', 'Not found', page404()];
}
function route() {
  const { parts, query } = parseHash();
  const [key, title, html] = resolve(parts, query);
  cleanups.forEach((fn) => fn());
  cleanups = [];
  const app = $('#app');
  app.innerHTML = html;
  document.title = key === 'home' ? title : `${title} | Bestari Food Berhad`;
  setActiveNav(key, location.hash || '#/');
  document.body.classList.toggle('is-shop', key === 'shop');
  const backTo = $('[data-back-to]', app);
  $('#toTop').setAttribute('aria-label', backTo ? `Back to ${backTo.dataset.backTo}, or to the top` : 'Back to top');
  /* Moving between pages of one IR section keeps the hero scrolled away, as Farm Fresh's IR does. */
  const section = parts[1] || '';
  const staysInSection = key === 'ir' && lastRoute.key === 'ir' && section && section === lastRoute.section;
  const menu = $('.irmenu');
  window.scrollTo({ top: staysInSection && menu ? menu.offsetTop - $('.hdr').offsetHeight : 0, behavior: 'instant' });
  lastRoute = { key, section };
  hydrate(app);
  closeDrawer($('#navDrawer'));
}

function initSlider(root) {
  const slider = $('[data-slider]', root);
  if (!slider) return;
  const track = $('.slider__track', slider); const dots = $$('[data-dot]', slider); const count = dots.length;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let index = 0; let timer = null;
  const show = (i) => { index = (i + count) % count; track.style.transform = `translateX(-${index * 100}%)`; dots.forEach((d, j) => d.setAttribute('aria-current', String(j === index))); };
  const pause = () => { clearInterval(timer); timer = null; };
  const resume = () => { if (!reduce && !timer) timer = setInterval(() => show(index + 1), 5000); };
  $('[data-prev]', slider).addEventListener('click', () => show(index - 1));
  $('[data-next]', slider).addEventListener('click', () => show(index + 1));
  dots.forEach((d, j) => d.addEventListener('click', () => show(j)));
  slider.addEventListener('mouseenter', pause); slider.addEventListener('mouseleave', resume);
  slider.addEventListener('focusin', pause); slider.addEventListener('focusout', resume);
  show(0); resume();
  cleanups.push(pause);
}
function initCarousels(root) {
  $$('[data-carousel]', root).forEach((box) => {
    const track = $('.carousel__track', box); const prev = $('[data-prev]', box); const next = $('[data-next]', box);
    const update = () => { prev.disabled = track.scrollLeft < 8; next.disabled = track.scrollLeft + track.clientWidth > track.scrollWidth - 8; };
    prev.addEventListener('click', () => track.scrollBy({ left: -track.clientWidth, behavior: 'smooth' }));
    next.addEventListener('click', () => track.scrollBy({ left: track.clientWidth, behavior: 'smooth' }));
    track.addEventListener('scroll', update, { passive: true });

  });
}
function initTabs(root) {

    const select = (id, focusTab) => {

    tabs.forEach((t, i) => {

        if (!(e.key in keys)) return;
        e.preventDefault();

    });
    box.addEventListener('click', (e) => {
      const go = e.target.closest('[data-goto]');

    $$('input, textarea', form).forEach((input) => {
      input.removeAttribute('aria-invalid');
      if (input.type === 'checkbox') { if (input.required && !input.checked) { fail(input, 'Please tick this box to continue.'); ok = false; } return; }
      const value = input.value.trim();
      if (input.required && !value) { fail(input, 'Please fill this in.'); ok = false; } else if (input.type === 'email' && value && !EMAIL.test(value)) { fail(input, 'Please enter a valid email address.'); ok = false; }
    });
    if (!ok) { $('[aria-invalid="true"]', form).focus(); return; }
    const box = document.createElement('div');
    box.className = 'thanks'; box.setAttribute('role', 'status'); box.tabIndex = -1;
    box.textContent = form.dataset.form === 'alerts' ? 'Thank you for subscribing. You’ll get our news by email. (Preview: nothing was sent.)' : 'Thank you. Our IR team will be in touch. (Preview: nothing was sent.)';
    form.replaceWith(box);
    box.focus();
  }));
}
function initCalculator(root) {
  const form = $('[data-calc]', root);
  if (!form) return;
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const num = (name) => Number(String(form.elements[name].value).replace(/,/g, '').trim());
    const shares = num('shares'); const buy = num('buy'); const sell = num('sell'); const div = form.elements.div.value.trim() ? num('div') : 0;
    const err = $('#calcErr');
    if (!Number.isInteger(shares) || shares <= 0) { err.textContent = 'Enter a whole number of shares above zero.'; return; }
    if (!(buy > 0) || !(sell > 0)) { err.textContent = 'Enter buy and sell prices above zero, in RM.'; return; }
    if (Number.isNaN(div) || div < 0) { err.textContent = 'Dividends must be zero or more.'; return; }
    err.textContent = '';
    const cost = shares * buy; const value = shares * sell; const dividends = (shares * div) / 100; const total = value - cost + dividends;
    $('#cCost').textContent = money(cost); $('#cValue').textContent = money(value); $('#cGain').textContent = money(value - cost); $('#cDiv').textContent = money(dividends);
    $('#cTotal').textContent = `${money(total)} (${((total / cost) * 100).toFixed(1)}%)`;
  });
}
function initVideos(root) {
  $$('[data-video]', root).forEach((btn) => btn.addEventListener('click', () => {
    $('#videoSlot').innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${btn.dataset.video}?rel=0&autoplay=1" title="Bestari recipe video" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
    $('#videoModal').showModal();
  }));
}
function hydrate(root) {
  [initSlider, initCarousels, initTabs, initFilters, initProductDetail, initShop, initChart, initForms, initCalculator, initVideos].forEach((init) => init(root));
}

/* Global wiring, once. */
buildChrome();
renderCart();
$('#burger').addEventListener('click', () => openDrawer($('#navDrawer')));
$('#cartBtn').addEventListener('click', () => openDrawer($('#cartDrawer')));
$('#shopQ').addEventListener('input', (e) => setShopQuery(e.target.value));
$('#shopSearch').addEventListener('submit', (e) => {
  e.preventDefault();
  setShopQuery($('#shopQ').value);
  const range = $('#range');
  if (range) window.scrollTo({ top: range.getBoundingClientRect().top + window.scrollY - $('.hdr').offsetHeight, behavior: 'smooth' });
  $('#shopQ').blur();
});
$$('.drawer').forEach((d) => d.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) closeDrawer(d); }));
$('#cartBody').addEventListener('click', (e) => { const b = e.target.closest('[data-qty]'); if (b) changeQty(b.dataset.key, Number(b.dataset.qty)); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $$('.drawer.is-open').forEach(closeDrawer); });
$('#videoClose').addEventListener('click', () => $('#videoModal').close());
$('#videoModal').addEventListener('close', () => { $('#videoSlot').innerHTML = ''; });
$('#videoModal').addEventListener('click', (e) => { if (e.target.id === 'videoModal') $('#videoModal').close(); });
$('#pvClose').addEventListener('click', () => $('#pvNote').remove());
const toTop = $('#toTop');
/* A page can name a section the up button returns to first ([data-back-to], e.g. Sustainability's
   "Our commitment"); from that section or above it, the button goes to the top as usual. */
toTop.addEventListener('click', () => {
  const anchor = $('#app [data-back-to]');
  const target = anchor ? Math.max(0, anchor.getBoundingClientRect().top + window.scrollY - $('.hdr').offsetHeight) : 0;
  window.scrollTo({ top: window.scrollY > target + 4 ? target : 0, behavior: 'smooth' });
});
window.addEventListener('hashchange', route);
route();
