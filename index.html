<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Bestari Food Berhad: Malaysian food premixes and ingredients since 2004. Mudah dan sedap!"
    />
    <title>Bestari Food Berhad | Mudah dan Sedap!</title>
    <link rel="icon" href="/assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Noto+Sans+SC:wght@400;600&display=swap"
    />
    <!-- Archivo has no arrows or symbols (→ ← ↗ ↓ ● ✕), so a JetBrains Mono file holding only those six
         glyphs is requested on its own; without it the browser draws them in a system font. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&text=%E2%86%92%E2%86%90%E2%86%97%E2%86%93%E2%97%8F%E2%9C%95&display=swap"
    />
    <!-- Archivo's "&" is a stylised Et shape that reads oddly, so a Roboto Flex file holding only "&" is
         requested on its own (all its weights and widths, to match condensed and normal text). -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&text=%26&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
