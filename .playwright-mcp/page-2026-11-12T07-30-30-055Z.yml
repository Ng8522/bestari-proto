            - generic [ref=f1e65]:
              - paragraph [ref=f1e66]: Bestari Food Berhad is an investment holding company. Through its subsidiaries, the Group sells food premixes, supplies food ingredients and food processing and production equipment, and provides spare parts and maintenance services.
              - paragraph [ref=f1e67]: Food premixes are blends of ingredients formulated in specific proportions for food preparation and processing. Our products are sold mainly under the Bestari brand, in retail and commercial packs. Retail packs go through supermarkets and other retail channels. Larger packs go to food manufacturers and food service operators such as hotels, restaurants, cafés and caterers.
              - paragraph [ref=f1e68]: Our flagship Crispy Fried Chicken Coating Mix, the Multipurpose Crispy Frying Flour Mix, has been sold since 2004 and leads its category in Malaysia.
